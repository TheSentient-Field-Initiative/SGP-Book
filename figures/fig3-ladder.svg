<g font-size="13">
<rect x="120" y="50" width="600" height="36" rx="6" fill="#eef4ff" stroke="#333"/><circle cx="145" cy="68" r="9" fill="#c22"/><text x="250" y="73">1. Response vs relation — REDUCES (0/66,067)</text>
<rect x="120" y="92" width="600" height="36" rx="6" fill="#eef4ff" stroke="#333"/><circle cx="145" cy="110" r="9" fill="#2a2"/><text x="250" y="115">2. Orientation — FORCED, but standard theory</text>
<rect x="120" y="134" width="600" height="36" rx="6" fill="#eef4ff" stroke="#333"/><circle cx="145" cy="152" r="9" fill="#2a2"/><text x="250" y="157">3. Closure: collapse + universality (R29/R31/R40)</text>
<rect x="120" y="176" width="600" height="36" rx="6" fill="#fff3e0" stroke="#333"/><circle cx="145" cy="194" r="9" fill="#c22"/><text x="250" y="199">3b. Reconstruction FALSE (R35); convexity FALSE (R50)</text>
<rect x="120" y="218" width="600" height="36" rx="6" fill="#eef4ff" stroke="#333"/><circle cx="145" cy="236" r="9" fill="#2a2"/><text x="250" y="241">4. Fiber geometry + R_C maximum (Paper 3, manuscript)</text>
