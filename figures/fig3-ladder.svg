<rect x="120" y="302" width="600" height="36" rx="6" fill="#eef4ff" stroke="#333"/><circle cx="145" cy="320" r="9" fill="#2a2"/><text x="250" y="325">6. T0 boundary; composition boundary (sharp, standard)</text>
<rect x="120" y="344" width="600" height="36" rx="6" fill="#eee" stroke="#333"/><circle cx="145" cy="362" r="9" fill="#888"/><text x="250" y="367">7–8. Interaction / selection / physics: NO new bridge</text>
</g>
<text x="450" y="405" text-anchor="middle" font-size="12" fill="#555">Green = established result (standard mathematics). Red = clean negative. Gray = closed without a bridge. Manuscripts await peer review.</text>
