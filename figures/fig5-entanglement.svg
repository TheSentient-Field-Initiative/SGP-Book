<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="sans-serif">
<title>Figure 5 — Entanglement correlations without signaling (illustration)</title>
<text x="450" y="28" text-anchor="middle" font-size="13" fill="#555">Figure 5 — Correlated outcomes, no message (illustration)</text>
<circle cx="450" cy="120" r="30" fill="#eef4ff" stroke="#333"/>
<text x="450" y="126" text-anchor="middle" font-size="13">source</text>
<text x="450" y="170" text-anchor="middle" font-size="12" fill="#555">joint state |&#9363;_AB</text>
<line x1="420" y1="120" x2="200" y2="120" stroke="#333" stroke-width="1.5"/>
<line x1="480" y1="120" x2="700" y2="120" stroke="#333" stroke-width="1.5"/>
<rect x="110" y="80" width="120" height="80" rx="8" fill="#fff" stroke="#333"/>
<text x="170" y="105" text-anchor="middle" font-size="13" font-weight="bold">Station A</text>
<text x="170" y="128" text-anchor="middle" font-size="12">outcome: 0 or 1</text>
<rect x="670" y="80" width="120" height="80" rx="8" fill="#fff" stroke="#333"/>
<text x="730" y="105" text-anchor="middle" font-size="13" font-weight="bold">Station B</text>
<text x="730" y="128" text-anchor="middle" font-size="12">outcome: correlated</text>
<path d="M 250 220 Q 450 260 650 220" fill="none" stroke="#c00" stroke-width="2" stroke-dasharray="6,4"/>
<line x1="420" y1="232" x2="480" y2="244" stroke="#c00" stroke-width="3"/>
<line x1="480" y1="232" x2="420" y2="244" stroke="#c00" stroke-width="3"/>
<text x="450" y="280" text-anchor="middle" font-size="13" fill="#c00">no controllable signal travels here (no-signaling theorem)</text>
<text x="450" y="298" text-anchor="middle" font-size="11" fill="#555">Bell violations rule out local hidden variables — they do not license messaging, minds, or metaphysics.</text>
</svg>
