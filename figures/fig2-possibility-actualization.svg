<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="sans-serif">
<title>Figure 2 — Mathematical possibility vs actualization (illustration)</title>
<text x="450" y="28" text-anchor="middle" font-size="13" fill="#555">Figure 2 — Possibility is cheap; actuality needs a selector (illustration)</text>
<rect x="30" y="60" width="330" height="200" rx="8" fill="#eef4ff" stroke="#333"/>
<text x="195" y="85" text-anchor="middle" font-size="14" font-weight="bold">The catalog (possibility)</text>
<g fill="none" stroke="#446" stroke-width="1.5">
<circle cx="90" cy="140" r="22"/><circle cx="160" cy="130" r="22"/><circle cx="230" cy="140" r="22"/>
<circle cx="300" cy="130" r="22"/><circle cx="125" cy="195" r="22"/><circle cx="195" cy="205" r="22"/><circle cx="265" cy="195" r="22"/>
</g>
<text x="195" y="245" text-anchor="middle" font-size="12" fill="#555">every consistent structure: offered, none favored</text>
<path d="M 380 160 L 520 160" stroke="#c00" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="520,160 508,154 508,166" fill="#c00"/>
<text x="450" y="145" text-anchor="middle" font-size="14" fill="#c00">selector?</text>
<rect x="540" y="60" width="330" height="200" rx="8" fill="#efffef" stroke="#333"/>
<text x="705" y="85" text-anchor="middle" font-size="14" font-weight="bold">The world (actuality)</text>
<g fill="none" stroke="#446" stroke-width="1.5">
<circle cx="620" cy="150" r="22"/><circle cx="705" cy="150" r="22" stroke="#0a0" stroke-width="3"/><circle cx="790" cy="150" r="22"/>
</g>
<text x="705" y="205" text-anchor="middle" font-size="12" fill="#555">one page of the catalog, realized</text>
<text x="705" y="225" text-anchor="middle" font-size="12" fill="#555">and persistent — why this one?</text>
<text x="450" y="285" text-anchor="middle" font-size="12" fill="#555">Pointing at the match is correspondence. Naming the picker is explanation. The program found the first, not the second.</text>
</svg>
